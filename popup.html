<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:320px;font:13px/1.5 system-ui,sans-serif;background:#14161a;color:#e7e9ee;padding:16px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
header svg{color:#dc2743}
header h1{font-size:15px;font-weight:800;color:#fff}
header .ver{font-size:9px;font-weight:600;color:#555;background:rgba(255,255,255,.06);padding:2px 6px;border-radius:4px;margin-left:4px}
#status{color:#9aa1ab;margin-bottom:14px;font-size:12px;line-height:1.5}
#mediaInfo{display:none;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;margin-bottom:14px}
#mediaInfo .mi-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#aaa}
#mediaInfo .mi-row+ .mi-row{margin-top:6px}
#mediaInfo .mi-badge{padding:2px 8px;border-radius:4px;font-weight:600;font-size:10px;text-transform:uppercase}
.mi-ph{background:rgba(59,130,246,.15);color:#60a5fa}
.mi-vd{background:rgba(239,68,68,.15);color:#f87171}
button{width:100%;display:block;border:none;cursor:pointer;padding:10px 12px;border-radius:10px;font:700 13px system-ui;margin-bottom:8px;transition:filter .12s,transform .08s}
.primary{background:linear-gradient(45deg,#dc2743,#bc1888);color:#fff}
.primary:hover{filter:brightness(1.12)}
.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14)}
.ghost:hover{background:rgba(255,255,255,.14)}
button:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none}
button:active:not(:disabled){transform:scale(.97)}
footer{margin-top:12px;color:#6b7280;font-size:11px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px;line-height:1.5}
.ok{color:#34d399}.warn{color:#fbbf24}.err{color:#f87171}
</style></head>
<body>
<header>
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.2 8.5l-5.5 3.2c-.3.2-.7 0-.7-.4V7.2c0-.4.4-.6.7-.4l5.5 3.2c.3.2.3.7 0 .9z"/></svg>
<h1>InstaSave<span class="ver">v3</span></h1>
</header>
<p id="status">Verificando...</p>
<div id="mediaInfo"></div>
<button class="primary" id="btnOpen" disabled>Abrir painel</button>
<button class="ghost" id="btnScan" disabled>Escanear midia atual</button>
<footer>Fotos, videos, reels e carrosseis.<br>Funciona em posts, reels e stories.</footer>
<script src="popup.js"></script>
</body></html>
